name: Deploy preview

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Write PREVIEW to create or update the isolated workers.dev preview'
        required: true

jobs:
  preview:
    if: ${{ inputs.confirm == 'PREVIEW' && vars.RESERVA_PREVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm e2e
      - run: pnpm deploy:preview:dry-run
      - run: pnpm deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm verify:public:preview
